services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  springboot-app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      MONGO_DB_URI: mongodb://mongo:27017/digiDB
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      mongo:
        condition: service_healthy

  npm-app:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    environment:
      VITE_BACKEND_URL: http://springboot-app:8080
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - springboot-app

volumes:
  mongo-data:
